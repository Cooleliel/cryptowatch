name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  analyze-and-test:
    name: Analyse statique et tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Installation du SDK Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Exécution des tests
        run: flutter test
